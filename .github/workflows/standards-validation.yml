name: Validate and publish Rust Coding Standards

# PRs validate only. Main publishes the same build after all checks pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned local site builder
        run: python -m pip install -r requirements-docs.txt
      - name: Validate rule IDs and source links
        run: python tools/verify_standards.py
      - name: Build documentation
        run: zensical build --strict
      - name: Validate built rule anchors and search
        run: python tools/verify_standards.py --site
      - name: Test Rust example validator
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Use current stable Rust for reusable examples
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Compile and run marked Rust examples
        run: python tools/verify_rust_examples.py
      - name: Upload validated documentation
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: source-and-examples
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
