name: Validate Rust Coding Standards

# Source-only CI: no website publication, Pages artifact or credential use.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Select Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned local site builder
        run: python -m pip install -r requirements-docs.txt
      - name: Validate rule IDs and source links
        run: python tools/verify_standards.py
      - name: Build private docs without publishing
        run: zensical build
      - name: Validate built rule anchors and search
        run: python tools/verify_standards.py --site
      - name: Test Rust example validator
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Use current stable Rust for reusable examples
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Compile and run marked Rust examples
        run: python tools/verify_rust_examples.py
