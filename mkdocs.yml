# Documentation build, local preview and GitHub Pages configuration.
# MkDocs-compatible configuration used by Zensical.
site_name: Zevarix RCS
site_url: https://rcs.zevarix.com/
site_description: Practical Rust coding standards for correct, fast, maintainable software developed and reviewed by humans and AI agents
repo_name: zevarix/rust-coding-standards
repo_url: https://github.com/zevarix/rust-coding-standards
copyright: Copyright (c) 2026 Peder Klockmann (Zevarix) · Open rules MIT OR Apache-2.0 · Forge theme rights reserved

docs_dir: docs
site_dir: site
use_directory_urls: true

nav:
  - Home: index.md
  - Standards index: standards.md
  - Reviewing code: review-guide.md
  - Anti-AI-Slop Rust guide: ai-rust-code-quality.md
  - Risk-weighted verification: verification/assurance.md
  - Coding rules:
      - Style and structure: rules/style-and-structure.md
      - Types, APIs and errors: rules/types-and-errors.md
      - Numbers and bounds: rules/numbers-and-bounds.md
      - Untrusted inputs: rules/untrusted-input.md
      - Safety and user data: rules/safety.md
      - Filesystem identity and effects: rules/mutable-effects.md
      - SQLite and native paths: rules/persistence-and-paths.md
      - External processes and cancellation: rules/processes-and-cancellation.md
      - Concurrency and tooling: rules/concurrency-and-tooling.md
      - Performance and efficiency: rules/performance.md
      - Progress, diagnostics and logging: rules/observability.md
      - Testing and documentation: rules/testing.md
  - Rust skills: skills.md
  - Performance workflows:
      - Comparable measurement: performance/measurement.md
      - Profiling: performance/profiling.md
      - Selecting optimizations: performance/optimization.md
  - Adopting the standards: adoption.md
  - Local preview: site-preview.md
  - Sources and attribution: sources.md
  - Contributing: contributing.md
  - Licensing and reuse: licensing.md
  - Public-readiness checklist: publication-readiness.md

theme:
  name: material
  variant: modern
  logo: assets/brand/forge-crab.svg
  favicon: assets/brand/forge-crab.svg
  font: false
  language: en
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - content.code.copy
    - toc.follow
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

extra_css:
  - stylesheets/forge.css

plugins:
  - search
  - meta-descriptions:
      trim: true
      max_length: 160
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Engineering guidance for Rust developers and AI coding agents. The adopting
        project's requirements, safety boundaries and supported platforms remain authoritative.
      sections:
        Start here:
          - index.md: What the standards cover and how to use them
          - standards.md: Indexed, scoped Rust coding rules
          - ai-rust-code-quality.md: Review AI-generated Rust for correctness, performance and maintainability
          - adoption.md: Project-level adoption of RCS rules
          - review-guide.md: Evidence-based review method
          - verification/assurance.md: Risk-weighted behavior verification
        Rust coding rules:
          - rules/*.md
        Performance workflows:
          - performance/*.md
        Skills and contribution:
          - skills.md: Installable Rust guidance and performance skills
          - contributing.md: Propose improvements to the standard
          - sources.md: Technical sources and attribution

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
